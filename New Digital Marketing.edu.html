.floor{position:absolute;left:-30%;right:-30%;bottom:-8%;height:55%;transform-origin:50% 100%;transform:rotateX(68deg);background:repeating-linear-gradient(90deg,#FC303045 0 1px,transparent 1px 50px),repeating-linear-gradient(0deg,#FC303045 0 1px,transparent 1px 50px);-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
.it{position:absolute;transform-style:preserve-3d;animation:fl 7s ease-in-out infinite}
.sp{position:relative;transform-style:preserve-3d}
.spin{animation:spin 16s linear infinite}.swy{animation:sw 9s ease-in-out infinite alternate}
.lg3{position:relative;width:180px;height:125px;transform-style:preserve-3d}
.lg3 b{position:absolute;width:70px;height:61px;clip-path:polygon(0 0,100% 0,50% 100%)}
.cb i{position:absolute;inset:0;border:1px solid #ffffffaa;background:linear-gradient(135deg,#FC3030d9,#ff9a9ad9)}

.ball{border-radius:50%;background:radial-gradient(circle at 30% 28%,#fff,#ffa0a0 32%,#FC3030 68%,#8a0f0f);box-shadow:0 24px 30px #FC303040}
.rs{width:100%;height:100%;transform-style:preserve-3d;animation:rz 12s linear infinite}
.ring{width:100%;height:100%;border:6px dashed #FC3030b3;border-radius:50%}

@keyframes spin{to{transform:rotateX(360deg) rotateY(360deg)}}
@keyframes sw{from{transform:rotateY(-38deg) rotateX(12deg)}to{transform:rotateY(38deg) rotateX(-8deg)}}
@keyframes rz{from{transform:rotateX(68deg) rotateZ(0)}to{transform:rotateX(68deg) rotateZ(360deg)}}
@media(max-width:760px){.it.hs{display:none}}
@media(prefers-reduced-motion:reduce){.it,.spin,.swy,.rs{animation:none}}
